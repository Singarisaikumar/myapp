apiVersion: v1
kind: Service

metadata:
  name: {{ include "production-platform-api.fullname" . }}

  labels:
    {{- include "production-platform-api.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "production-platform-api.selectorLabels" . | nindent 4 }}

  ports:

    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP